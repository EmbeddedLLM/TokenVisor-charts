apiVersion: v1
kind: ServiceAccount
metadata:
  name: disk-metrics-exporter
  namespace: tokenvisor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: disk-metrics-exporter
  namespace: tokenvisor
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: disk-metrics-exporter
  namespace: tokenvisor
subjects:
  - kind: ServiceAccount
    name: disk-metrics-exporter
    namespace: tokenvisor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: disk-metrics-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: disk-metrics-exporter
  namespace: tokenvisor
  labels:
    app.kubernetes.io/name: disk-metrics-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: disk-metrics-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: disk-metrics-exporter
    spec:
      imagePullSecrets:
        - name: github-registry-secret
      serviceAccountName: disk-metrics-exporter
      automountServiceAccountToken: true
      containers:
        - name: exporter
          image: ghcr.io/embeddedllm/disk-metrics-exporter:0.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET_NAMESPACE
              value: tokenvisor
            - name: APPROVED_TARGETS
              value: |
                [
                  {
                    "selector": "app=emu",
                    "container": "emu",
                    "paths": [
                      "/hf_repo"
                    ]
                  },
                  {
                    "selector": "app.kubernetes.io/name=postgresql,app.kubernetes.io/component=database",
                    "container": "postgres",
                    "paths": [
                      "/var/lib/postgresql/data"
                    ]
                  }
                ]
            - name: PORT
              value: "8000"
            - name: COLLECTION_TIMEOUT_SECONDS
              value: "10"
          ports:
            - name: metrics
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
---
apiVersion: v1
kind: Service
metadata:
  name: disk-metrics-exporter
  namespace: tokenvisor
  labels:
    app: server
    app.kubernetes.io/name: disk-metrics-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: disk-metrics-exporter
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: disk-metrics-exporter
  namespace: tokenvisor
  labels:
    app.kubernetes.io/name: disk-metrics-exporter
spec:
  namespaceSelector:
    matchNames:
      - tokenvisor
  selector:
    matchLabels:
      app: server
  endpoints:
    - port: metrics
      path: /metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: disk-metrics-exporter-same-namespace
  namespace: tokenvisor
  labels:
    app.kubernetes.io/name: disk-metrics-exporter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: disk-metrics-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: metrics
