apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  labels:
    app.kubernetes.io/instance: vmalert-tokenvisor
    app.kubernetes.io/part-of: vm-operator
  name: vmalert
spec:
  replicaCount: 1
  datasource:
    url: "http://vmselectinternal-victoria-cluster.tokenvisor.svc:8481/select/0/prometheus"
  remoteWrite:
    url: "http://vminsertinternal-victoria-cluster.tokenvisor.svc:8480/insert/0/prometheus"
  remoteRead:
    url: "http://vmselectinternal-victoria-cluster.tokenvisor.svc:8481/select/0/prometheus"
  notifier:
    url: "http://vmalertmanager-tokenvisor-alertmanager.tokenvisor.svc:9093"
  evaluationInterval: "30s"
  ruleSelector: # select rules with this label
    matchLabels:
      vmalert/rule-type: metrics
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  labels:
    app.kubernetes.io/instance: vmalert-tokenvisor
    app.kubernetes.io/part-of: vm-operator
  name: vmalert-log
spec:
  replicaCount: 1
  datasource:
    url: "http://vls-victoria-logs-single-server.tokenvisor.svc:9428"
  notifier:
    url: "http://vmalertmanager-tokenvisor-alertmanager.tokenvisor.svc:9093"
  evaluationInterval: "30s"
  ruleSelector:
    matchLabels:
      vmalert/rule-type: logs
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  labels:
    app.kubernetes.io/instance: vmalertmanager-tokenvisor
    app.kubernetes.io/part-of: vm-operator
  name: tokenvisor-alertmanager
spec:
  replicaCount: 1
  disableNamespaceMatcher: true # to avoid alert channels to blackhole: https://github.com/VictoriaMetrics/VictoriaMetrics/issues/8285
  configNamespaceSelector: # only select config from this namespace
    matchLabels:
      kubernetes.io/metadata.name: tokenvisor
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"
