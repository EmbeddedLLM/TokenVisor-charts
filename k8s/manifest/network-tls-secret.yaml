# --- Option 1: bring your own certificate (no cert-manager) ---
# Create the Secret directly from cert/key files. It must be named `tokenvisor-tls-secret`
# in the `tokenvisor` namespace to match the gateway listener's certificateRefs:
#   kubectl create secret tls tokenvisor-tls-secret \
#     --cert=tls.crt --key=tls.key -n tokenvisor
#
# --- Option 2: cert-manager + Let's Encrypt (resources below) ---
# cert-manager provisions and renews the `tokenvisor-tls-secret` Secret from Let's Encrypt.
# Prerequisites:
#   - cert-manager installed with `--set config.enableGatewayAPI=true`.
#   - The HTTPS listener + `certificateRefs: tokenvisor-tls-secret` uncommented in
#     network-gatewayclass-and-gateway.yaml.
#   - Port 80 reachable from the internet (Let's Encrypt HTTP-01 challenge). The ACME
#     challenge path (/.well-known/acme-challenge/...) is more specific than the "/"
#     redirect rule, so it is served even when HTTP->HTTPS redirection is enabled.
# Replace `you@example.com` and `yourdomain.com` before applying.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: you@example.com
    # Use the staging server while testing to avoid Let's Encrypt rate limits:
    # server: https://acme-staging-v02.api.letsencrypt.org/directory
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: cilium-gateway
                namespace: tokenvisor
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tokenvisor-tls
  namespace: tokenvisor
spec:
  # Must match the Secret name in the gateway listener's certificateRefs.
  secretName: tokenvisor-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - yourdomain.com
