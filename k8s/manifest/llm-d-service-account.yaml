---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-d-epp
  namespace: llm-d
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-d-epp-pod-reader
  namespace: llm-d
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-d-epp-pod-reader
  namespace: llm-d
subjects:
  - kind: ServiceAccount
    name: llm-d-epp
    namespace: llm-d
roleRef:
  kind: Role
  name: llm-d-epp-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-d-epp-inference-reader
  namespace: llm-d
rules:
  - apiGroups:
      - inference.networking.k8s.io
      - inference.networking.x-k8s.io
      - llm-d.ai
    resources:
      - inferencepools
      - inferenceobjectives
      - inferencemodelrewrites
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-d-epp-inference-reader
  namespace: llm-d
subjects:
  - kind: ServiceAccount
    name: llm-d-epp
    namespace: llm-d
roleRef:
  kind: Role
  name: llm-d-epp-inference-reader
  apiGroup: rbac.authorization.k8s.io
