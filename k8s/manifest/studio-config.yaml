---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studio-config
  namespace: tokenvisor
data:
  HOST: "devstudio.tokenvisor.ai"
  ORIGIN: "https://devstudio.tokenvisor.ai"
  EMU_URL: "http://emu-api-server.tokenvisor.svc.cluster.local:5969"
  EMU_SERVICE_KEY: "lalala"
  STUDIO_PORT: "4969"
  STUDIO_AUTH_SECRET: "changeme"
  NODE_ENV: "production"
  BODY_SIZE_LIMIT: "Infinity"
  CHECK_ORIGIN: "false"
  USE_SECURE_COOKIES: "true"
  ABSOLUTE_AUTH_TIMEOUT: "86400"
  IDLE_AUTH_TIMEOUT: "900"

  ### OAUTH & AUTH0 & SSO Configuration ###
  # JWT_CLAIMS_NAMESPACE=

  # AUTH0_ISSUER_BASE_URL=<AUTH0_DOMAIN>
  # AUTH0_CLIENT_ID=<CLIENT_ID>
  # AUTH0_CLIENT_SECRET=<CLIENT_SECRET>

  # OAUTH2_DOMAIN=https://<OAUTH2_DOMAIN>/
  # OAUTH2_AUTHORIZATION_URL=https://<OAUTH2_DOMAIN>/authorize
  # OAUTH2_TOKEN_URL=https://<OAUTH2_DOMAIN>/oauth/token
  # OAUTH2_USERINFO_URL=https://<OAUTH2_DOMAIN>/userinfo
  # OAUTH2_LOGOUT_URL=https://<OAUTH2_DOMAIN>/oidc/logout?client_id=<CLIENT_ID>&post_logout_redirect_uri=http://localhost:4969 # Optional, used to log out with IdP
  # OAUTH2_SCOPE=openid profile email
  # OAUTH2_CLIENT_ID=<CLIENT_ID>
  # OAUTH2_CLIENT_SECRET=<CLIENT_SECRET>
