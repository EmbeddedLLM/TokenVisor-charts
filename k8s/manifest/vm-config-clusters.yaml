apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  labels:
    app.kubernetes.io/instance: vmagent-tokenvisor
    app.kubernetes.io/part-of: vm-operator
  name: vmagent-agg
spec:
  replicaCount: 3
  # HA Setup (Uncomment for HA)
  # nodeSelector:
  #   node-role.kubernetes.io/control-plane: "true"
  # tolerations:
  #   - key: node-role.kubernetes.io/control-plane
  #     operator: Exists
  #     effect: NoSchedule
  # affinity:
  #   podAntiAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       - labelSelector:
  #           matchLabels:
  #             app.kubernetes.io/instance: vmagent-agg
  #             app.kubernetes.io/name: vmagent
  #         topologyKey: "kubernetes.io/hostname"
  image:
    repository: victoriametrics/vmagent
    tag: v1.140.0
  resources:
    limits:
      cpu: 1500m
      memory: 1500Mi
    requests:
      cpu: 500m
      memory: 500Mi
  statefulMode: true
  statefulStorage:
    volumeClaimTemplate:
      spec:
        # storageClassName: local-path
        storageClassName: openebs-three-replica
        resources:
          requests:
            storage: 2Gi
  serviceSpec:
    metadata:
      name: vmagent-emu-aggregate
      labels:
        app.kubernetes.io/instance: vmagent-tokenvisor
    spec:
      clusterIP: None
      publishNotReadyAddresses: true
      ports:
        - name: http
          port: 8429
          targetPort: 8429
  remoteWrite:
    # - url: "http://vminsertinternal-victoria-cluster.tokenvisor.svc:8480/insert/0/prometheus/api/v1/write"
    #   streamAggrConfig:
    #     enableWindows: true
    #     keepInput: true
    #     rules:
    #       - match:
    #           - "llm_token_usage"
    #           - "embedding_token_usage"
    #           - "reranker_search_usage"
    #           - "spent"
    #         interval: 10s
    #         without: [service.instance.id]
    #         outputs: [increase]
    #         flush_on_shutdown: true
    - url: "http://vminsertinternal-victoria-cluster.tokenvisor.svc:8480/insert/0/prometheus/api/v1/write"
      streamAggrConfig:
        enableWindows: true
        rules:
          - match: "flower.task.runtime.seconds_bucket"
            interval: 1m
            without: [service.instance.id, worker]
            outputs: [total]
            keep_metric_names: true

          - match: '{__name__=~"flower.task.runtime.seconds_(count|sum)"}'
            interval: 1m
            without: [service.instance.id, worker]
            outputs: [total]
            keep_metric_names: true

          - match: '{__name__=~"http.+_bucket"}'
            interval: 1m
            without: [service.instance.id, http.server_name, http.host]
            outputs: [total]
            keep_metric_names: true

          - match: '{__name__=~"http.+_(count|sum)"}'
            interval: 1m
            without: [service.instance.id, http.server_name, http.host]
            outputs: [total]
            keep_metric_names: true

          - match: '{service.name=~"emu|starling", __name__=~"(llm|embed|rerank).+_bucket"}'
            interval: 1m
            without: [service.instance.id, service.name]
            outputs: [total]
            keep_metric_names: true
            output_relabel_configs:
              - target_label: "service.name"
                replacement: "emu"

          - match: '{service.name=~"emu|starling", __name__=~"(llm|embed|rerank).+_(count|sum)"}'
            interval: 1m
            without: [service.instance.id, service.name]
            outputs: [total]
            keep_metric_names: true
            output_relabel_configs:
              - target_label: "service.name"
                replacement: "emu"

          - match: "db.client.connections.usage"
            interval: 1m
            without: [service.instance.id]
            outputs: [total]
            keep_metric_names: true

          - match: "http.server.active_requests"
            interval: 1m
            without: [service.instance.id, http.server_name, http.host]
            outputs: [total]
            keep_metric_names: true

          - match:
              - "request_count"
              - "llm_request_count"
              - "embed_request_count"
              - "rerank_request_count"
            interval: 30s
            without: [service.instance.id]
            outputs: [total]
            keep_metric_names: true

          - match:
              - "llm_itl_milliseconds"
              - "llm_tpot_milliseconds"
              - "llm_ttft_milliseconds"
              - "embed_completion_time_milliseconds"
              - "rerank_completion_time_milliseconds"
            interval: 30s
            without: [service.instance.id]
            outputs: [max]
            keep_metric_names: true

          - match: "deployment_num_replica"
            interval: 10s
            without: [service.instance.id, service.name]
            outputs: [min]
            keep_metric_names: true
            output_relabel_configs:
              - target_label: "service.name"
                replacement: "emu"

          - match: "model_request_total"
            interval: 30s
            without: [service.instance.id]
            outputs: [total]
            keep_metric_names: true
          # - match:
          #     - "llm_token_usage"
          #     - "embedding_token_usage"
          #     - "reranker_search_usage"
          #     - "spent"
          #   interval: 10s
          #   without: [service.instance.id]
          #   outputs: [total]
          #   keep_metric_names: true
          #   flush_on_shutdown: true
          # output_relabel_configs:
          #   - action: replace
          #     source_labels: [__name__]
          #     regex: "^([^:]+):.*$"
          #     target_label: __name__
          #     replacement: "${1}_agg"
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  labels:
    app.kubernetes.io/instance: vmagent-tokenvisor
    app.kubernetes.io/part-of: vm-operator
  name: vmagent
spec:
  replicaCount: 3
  # HA Setup (Uncomment for HA)
  # nodeSelector:
  #   node-role.kubernetes.io/control-plane: "true"
  # tolerations:
  #   - key: node-role.kubernetes.io/control-plane
  #     operator: Exists
  #     effect: NoSchedule
  # affinity:
  #   podAntiAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       - labelSelector:
  #           matchLabels:
  #             app.kubernetes.io/name: vmagent
  #             app.kubernetes.io/instance: vmagent
  #         topologyKey: "kubernetes.io/hostname"
  image:
    repository: victoriametrics/vmagent
    tag: v1.140.0
  serviceScrapeNamespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - tokenvisor
          - dragonfly-operator-system
          - clickhouse-operator-system
          - cnpg-operator-system
          - vm-operator-system
  serviceScrapeRelabelTemplate:
    - targetLabel: job
      replacement: system-monitor
    - targetLabel: instance
      sourceLabels: [__meta_kubernetes_endpoint_node_name]
  # serviceScrapeSelector:
  #   matchExpressions:
  #     - key: app.kubernetes.io/instance
  #       operator: In
  #       values:
  #         - vm-service-scrape
  #     - key: scrape-by
  #       operator: In
  #       values:
  #         - vmagent
  podScrapeNamespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - tokenvisor
          - cnpg-operator-system
  # podScrapeSelector:
  #   matchLabels:
  #     app.kubernetes.io/instance: vm-podscrape-spec
  nodeScrapeSelector:
    matchLabels:
      app.kubernetes.io/instance: system-monitor
  resources:
    limits:
      cpu: 1500m
      memory: 1500Mi
    requests:
      cpu: 500m
      memory: 500Mi
  remoteWrite:
    - url: "http://vminsertinternal-victoria-cluster-shortterm.tokenvisor.svc:8480/insert/0/prometheus/api/v1/write"
---
