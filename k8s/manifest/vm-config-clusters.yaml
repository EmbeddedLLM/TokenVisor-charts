apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: system-monitor-pvc-capacity
  labels:
    app.kubernetes.io/part-of: vm-operator
    app.kubernetes.io/instance: system-monitor
spec:
  scheme: https
  tlsConfig:
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    insecureSkipVerify: true
    serverName: localhost
  bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  relabelConfigs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - targetLabel: __address__
      replacement: kubernetes.default.svc:443
    - sourceLabels: [__meta_kubernetes_node_name]
      regex: (.+)
      targetLabel: __metrics_path__
      replacement: /api/v1/nodes/$1/proxy/metrics
    - targetLabel: job
      replacement: system-monitor
  metricRelabelConfigs:
    - sourceLabels: [__name__]
      regex: "(kubelet_volume_stats_used_bytes|kubelet_volume_stats_capacity_bytes)"
      action: keep
    - action: labelkeep
      regex: __name__|namespace|job|instance|container|pod|persistentvolumeclaim
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: system-monitor-network-disk
  labels:
    app.kubernetes.io/part-of: vm-operator
    app.kubernetes.io/instance: system-monitor
spec:
  scheme: https
  tlsConfig:
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    insecureSkipVerify: true
    serverName: localhost
  bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  path: /metrics/cadvisor
  relabelConfigs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - source_labels: [__metrics_path__]
      target_label: metrics_path
    - targetLabel: job
      replacement: system-monitor
  metricRelabelConfigs:
    - sourceLabels: [__name__]
      regex: "(container_fs_reads_bytes_total|container_fs_writes_bytes_total|container_network_receive_bytes_total|container_network_transmit_bytes_total|machine_cpu_cores|machine_memory_bytes)"
      action: keep
    - action: labelkeep
      regex: __name__|namespace|job|instance|container|pod|interface
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: system-monitor-cpu-ram
  labels:
    app.kubernetes.io/part-of: vm-operator
    app.kubernetes.io/instance: system-monitor
spec:
  scheme: https
  tlsConfig:
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    insecureSkipVerify: true
    serverName: localhost
  bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  path: /metrics/resource
  relabelConfigs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - source_labels: [__metrics_path__]
      target_label: metrics_path
    - targetLabel: job
      replacement: system-monitor
  metricRelabelConfigs:
    - action: labelkeep
      regex: __name__|namespace|job|instance|container|pod
    - sourceLabels: [__name__]
      regex: "(container_memory_working_set_bytes|container_cpu_usage_seconds_total)"
      action: keep
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: skypilot-vllm-scrape
  labels:
    app.kubernetes.io/part-of: vm-operator
    app.kubernetes.io/instance: vm-pod-scrape
spec:
  selector:
    matchLabels:
      deployment: skypilot
      deployment-type: vllm
  namespaceSelector:
    matchNames:
      - skypilot
  podMetricsEndpoints:
    - targetPort: 8000
      relabelConfigs:
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: pod_name
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: clickhouse-keeper-metrics
  labels:
    app.kubernetes.io/part-of: vm-operator
    app.kubernetes.io/instance: vm-pod-scrape
spec:
  selector:
    matchLabels:
      app: clickhouse-keeper
  namespaceSelector:
    matchNames:
      - tokenvisor
  podMetricsEndpoints:
    - port: chk-metrics # please update the port if changed in the clickhouse keeper config
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod_name
        - sourceLabels: [__meta_kubernetes_pod_container_name]
          targetLabel: container_name
---
