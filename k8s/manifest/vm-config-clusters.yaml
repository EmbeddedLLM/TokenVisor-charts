apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  labels:
    app.kubernetes.io/instance: vmuser-tokenvisor
    app.kubernetes.io/part-of: vm-operator
  name: vmuser
spec:
  name: vmuser
  username: vmuser
  passwordRef:
    name: vmuser-secret
    key: password
  targetRefs:
    # vmui + vmselect
    - crd:
        kind: VMCluster/vmselect
        name: victoria-cluster
        namespace: tokenvisor
      target_path_suffix: "/select/0"
      paths:
        - "/vm/vmui"
        - "/vm/vmui/.*"
        - "/vm/prometheus/api/v1/query"
        - "/vm/prometheus/api/v1/query_range"
        - "/vm/prometheus/api/v1/series"
        - "/vm/prometheus/api/v1/status/.*"
        - "/vm/prometheus/api/v1/label/"
        - "/vm/prometheus/api/v1/label/[^/]+/values"
        - "/vm/prometheus/api/v1/status/tsdb"
        - "/vm/prometheus/api/v1/export"
        - "/vm/prometheus/api/v1/export/csv"
      drop_src_path_prefix_parts: 1
    - crd: # needed for vmui query
        kind: VMCluster/vmselect
        name: victoria-cluster
        namespace: tokenvisor
      target_path_suffix: "/select/0/prometheus"
      paths:
        - "/vm/api/v1/query"
        - "/vm/api/v1/query_range"
        - "/vm/api/v1/series"
        - "/vm/api/v1/status/.*"
        - "/vm/api/v1/label/"
        - "/vm/api/v1/label/[^/]+/values"
        - "/vm/api/v1/status/tsdb"
        - "/vm/api/v1/export"
        - "/vm/api/v1/export/csv"
      drop_src_path_prefix_parts: 1
    - static:
        urls:
          - http://vls-victoria-logs-single-server-0.vls-victoria-logs-single-server.tokenvisor.svc.cluster.local:9428/
          - http://vls-victoria-logs-single-server-1.vls-victoria-logs-single-server.tokenvisor.svc.cluster.local:9428/
      drop_src_path_prefix_parts: 1
      paths:
        - "/vl/select"
        - "/vl/select/.*"
        - "/vl/logsql"
        - "/vl/logsql/.*"
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/instance: vm-secret-tokenvisor
    app.kubernetes.io/part-of: vm-operator
  name: vmuser-secret
type: Opaque
data:
  password: dG9rZW52aXNvci12bS1vcGVyYXRvcg==
