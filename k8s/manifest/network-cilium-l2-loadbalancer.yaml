---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: cilium-l2-ip-pool
spec:
  # The blocks of IPs you want to use for LoadBalancers
  blocks:
    - start: "192.168.100.229"
      stop: "192.168.100.230"
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: cilium-l2-policy
spec:
  # Nodes to participate in L2 Announcment & Load Balancing
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  interfaces:
    - ^ens3 # Change this to match your node's physical interface name (e.g., ens192, eth0)
  externalIPs: false
  loadBalancerIPs: true
