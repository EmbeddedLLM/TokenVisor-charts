# https://openebs.io/docs/user-guides/replicated-storage-user-guide/replicated-pv-mayastor/configuration/rs-storage-class-parameters
# Setup node-affinity for fast near local storage if necessary
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-three-replica
parameters:
  protocol: nvmf
  fsType: xfs
  repl: "3"
allowVolumeExpansion: true
provisioner: io.openebs.csi-mayastor
