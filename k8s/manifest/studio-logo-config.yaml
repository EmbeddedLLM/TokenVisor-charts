apiVersion: v1
kind: ConfigMap
metadata:
  name: studio-logos
  namespace: tokenvisor
# Default TokenVisor branding. To white-label, replace the base64 values below
# (see docs/Guides-for-Admins/logo.md). All three keys are required: the
# deployment mounts them individually via subPath, so a missing key fails the pod.
#
# Regenerate a value with: base64 -w 0 <ICON>.svg
binaryData:
  favicon.svg: 
  icon-square.svg: 
  icon-landscape.svg: 
