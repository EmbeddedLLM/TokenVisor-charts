{{- if .Values.skypilotAmd.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.skypilotAmd.pvc.name }}
  namespace: {{ .Values.skypilotAmd.namespace }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: skypilot-amd
spec:
  accessModes:
    - ReadWriteOnce
{{- if .Values.skypilotAmd.pvc.storageClassName }}
  storageClassName: {{ .Values.skypilotAmd.pvc.storageClassName }}
{{- end }}
  resources:
    requests:
      storage: {{ .Values.skypilotAmd.pvc.size }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: skypilot-config
  namespace: {{ .Values.skypilotAmd.namespace }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: skypilot-amd
data:
  config.yaml: |
{{- .Values.skypilotAmd.config | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.skypilotAmd.serviceAccountName }}
  namespace: {{ .Values.skypilotAmd.namespace }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: skypilot-amd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.skypilotAmd.rbac.clusterRoleName }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: skypilot-amd
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.skypilotAmd.rbac.clusterRoleBindingName }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: skypilot-amd
subjects:
  - kind: ServiceAccount
    name: {{ .Values.skypilotAmd.serviceAccountName }}
    namespace: {{ .Values.skypilotAmd.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.skypilotAmd.rbac.clusterRoleName }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.skypilotAmd.service.name }}
  namespace: {{ .Values.skypilotAmd.namespace }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: skypilot-amd
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.skypilotAmd.service.port | int }}
      targetPort: {{ .Values.skypilotAmd.service.targetPort | int }}
      protocol: TCP
  selector:
    app: skypilot-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skypilot-api-server
  namespace: {{ .Values.skypilotAmd.namespace }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: skypilot-amd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: skypilot-api
  template:
    metadata:
      labels:
        app: skypilot-api
    spec:
      automountServiceAccountToken: true
      serviceAccountName: {{ .Values.skypilotAmd.serviceAccountName }}
{{- if .Values.skypilotAmd.imagePullSecrets }}
      imagePullSecrets:
{{- range .Values.skypilotAmd.imagePullSecrets }}
        - name: {{ if kindIs "map" . }}{{ .name }}{{ else }}{{ . }}{{ end }}
{{- end }}
{{- end }}
      containers:
        - name: skypilot-api
          image: {{ .Values.skypilotAmd.image }}
          imagePullPolicy: {{ .Values.skypilotAmd.imagePullPolicy }}
          env:
{{- range $key, $value := .Values.skypilotAmd.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Pre-deploy hook"
              mkdir -p /root/.sky
              echo "Copying config.yaml from ConfigMap `skypilot-config` to /root/.sky/config.yaml"
              cp /tmp/config.yaml /root/.sky/config.yaml
              sky api start --deploy && tail -f /root/.sky/api_server/server.log
          ports:
            - containerPort: {{ .Values.skypilotAmd.service.targetPort | int }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.skypilotAmd.service.targetPort | int }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.skypilotAmd.service.targetPort | int }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
{{- with .Values.skypilotAmd.resources }}
          resources:
{{- toYaml . | nindent 12 }}
{{- end }}
          volumeMounts:
            - name: state-volume
              mountPath: /root/.sky
              subPath: .sky
            - name: state-volume
              mountPath: /root/.ssh
              subPath: .ssh
            - name: skypilot-config
              mountPath: /tmp/config.yaml
              subPath: config.yaml
      volumes:
        - name: state-volume
          persistentVolumeClaim:
            claimName: {{ .Values.skypilotAmd.pvc.name }}
        - name: skypilot-config
          configMap:
            name: skypilot-config
{{- end }}
