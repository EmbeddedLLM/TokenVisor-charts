---
apiVersion: v1
kind: Secret # Seal with "kubeseal -f argocd-secret.yaml -w sealed-argocd-secret.yaml" to be safely uploaded to github.
metadata:
  name: github-registry-secret
  namespace: tokenvisor
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "auth": "echo -n "username:PAT" | base64"
        }
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: emu-secret
  namespace: tokenvisor
type: Opaque
stringData:
  EMU_OPENAI_API_KEY: ""
  EMU_ANTHROPIC_API_KEY: ""
  EMU_CEREBRAS_API_KEY: ""
  EMU_COHERE_API_KEY: ""
