apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.llmd.eppConfigMap }}
  namespace: {{ .Values.llmd.namespace }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ .Files.Get "files/llmd/epp-config.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.llmd.envoyConfigMap }}
  namespace: {{ .Values.llmd.namespace }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
data:
  envoy.yaml: |
{{ .Files.Get "files/llmd/envoy-config.yaml" | indent 4 }}
