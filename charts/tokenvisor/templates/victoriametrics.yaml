    app.kubernetes.io/instance: system-monitor
spec:
  scheme: https
  tlsConfig:
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    insecureSkipVerify: true
    serverName: localhost
  bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  path: /metrics/cadvisor
  relabelConfigs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - source_labels: [__metrics_path__]
      target_label: metrics_path
    - targetLabel: job
      replacement: system-monitor
  metricRelabelConfigs:
    - sourceLabels: [__name__]
      regex: "(container_fs_reads_bytes_total|container_fs_writes_bytes_total|container_network_receive_bytes_total|container_network_transmit_bytes_total|machine_cpu_cores|machine_memory_bytes)"
      action: keep
    - action: labelkeep
      regex: __name__|namespace|job|instance|container|pod|interface
---
