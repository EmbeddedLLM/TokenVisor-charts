{{- include "tokenvisor.haScheduling" (dict "ctx" $ "svc" .Values.victoriametrics.vmcluster.vmstorage "podLabels" (dict "app.kubernetes.io/name" "vmstorage" "app.kubernetes.io/instance" "victoria-cluster")) | nindent 4 }}
