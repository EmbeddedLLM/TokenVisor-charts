{{- if and .Values.victoriametrics.enabled (.Capabilities.APIVersions.Has "operator.victoriametrics.com/v1beta1") }}
{{- $vlValues := index .Values "victoria-logs-single" }}
{{- $vmUserSecret := default "vmuser-secret" .Values.victoriametrics.vmuser.existingSecret }}
{{- $vmagentAggReplicas := int .Values.victoriametrics.vmagentAgg.replicaCount }}
{{- $vmagentReplicas := int .Values.victoriametrics.vmagent.replicaCount }}
{{- $vmclusterReplicationFactor := int .Values.victoriametrics.vmcluster.replicationFactor }}
{{- $vmclusterShorttermReplicationFactor := int .Values.victoriametrics.vmclusterShortterm.replicationFactor }}
{{- $vmclusterLbEnabled := .Values.victoriametrics.vmcluster.requestsLoadBalancer.enabled }}
{{- $vmclusterLbReplicas := int .Values.victoriametrics.vmcluster.requestsLoadBalancer.replicaCount }}
{{- $vmclusterShorttermLbEnabled := .Values.victoriametrics.vmclusterShortterm.requestsLoadBalancer.enabled }}
{{- $vmclusterShorttermLbReplicas := int .Values.victoriametrics.vmclusterShortterm.requestsLoadBalancer.replicaCount }}
{{- $vmstorageReplicas := int .Values.victoriametrics.vmcluster.vmstorage.replicaCount }}
{{- $vmselectReplicas := int .Values.victoriametrics.vmcluster.vmselect.replicaCount }}
{{- $vminsertReplicas := int .Values.victoriametrics.vmcluster.vminsert.replicaCount }}
{{- $vmauthReplicas := int .Values.victoriametrics.vmauth.replicaCount }}
{{- $vmagentImageRepo := .Values.victoriametrics.images.vmagent.repository }}
{{- $vmagentImageTag := .Values.victoriametrics.images.vmagent.tag }}
{{- $vmauthImageRepo := .Values.victoriametrics.images.vmauth.repository }}
{{- $vmauthImageTag := .Values.victoriametrics.images.vmauth.tag }}
{{- $vmClusterVersion := .Values.victoriametrics.images.clusterVersion }}
{{- $vlHosts := include "tokenvisor.vlServerHostsJson" . | fromJsonArray }}
{{- $vlPort := int $vlValues.server.service.servicePort }}
{{- $keeperEnabled := and .Values.clickhouse.enabled (not (default false .Values.clickhouse.standalone)) }}
{{- $shorttermVmlstorageReplicas := int .Values.victoriametrics.vmclusterShortterm.vmstorage.replicaCount }}
{{- $shorttermVminsertReplicas := int .Values.victoriametrics.vmclusterShortterm.vminsert.replicaCount }}
{{- if lt $vlPort 1 }}
{{- fail "victoriametrics.enabled=true requires victoria-logs-single.server.service.servicePort > 0" }}
{{- end }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  labels:
    app.kubernetes.io/instance: vmagent-tokenvisor
    app.kubernetes.io/part-of: vm-operator
  name: vmagent-agg
  namespace: {{ include "tokenvisor.namespace" . }}
spec:
  replicaCount: {{ $vmagentAggReplicas }}
{{- include "tokenvisor.haScheduling" (dict "ctx" $ "svc" .Values.victoriametrics.vmagentAgg "podLabels" (dict "app.kubernetes.io/name" "vmagent" "app.kubernetes.io/instance" "vmagent-agg")) | nindent 2 }}
  image:
    repository: {{ $vmagentImageRepo }}
    tag: {{ $vmagentImageTag }}
{{- with .Values.victoriametrics.vmagentAgg.resources }}
  resources:
{{- toYaml . | nindent 4 }}
{{- end }}
  statefulMode: true
  statefulStorage:
    volumeClaimTemplate:
      spec:
        storageClassName: {{ .Values.victoriametrics.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.victoriametrics.vmagentAgg.storageSize }}
  serviceSpec:
    metadata:
      name: vmagent-emu-aggregate
      labels:
        app.kubernetes.io/instance: vmagent-tokenvisor
    spec:
      clusterIP: None
      publishNotReadyAddresses: true
      ports:
        - name: http
          port: 8429
          targetPort: 8429
  remoteWrite:
    - url: "http://vminsertinternal-victoria-cluster.{{ include "tokenvisor.namespace" . }}.svc:8480/insert/0/prometheus/api/v1/write"
      streamAggrConfig:
        enableWindows: true
        rules:
          - match: "flower.task.runtime.seconds_bucket"
            interval: 1m
            without: [service.instance.id, worker]
            outputs: [total]
            keep_metric_names: true

          - match: '{__name__=~"flower.task.runtime.seconds_(count|sum)"}'
            interval: 1m
            without: [service.instance.id, worker]
            outputs: [total]
            keep_metric_names: true

          - match: '{__name__=~"http.+_bucket"}'
            interval: 1m
            without: [service.instance.id, http.server_name, http.host]
            outputs: [total]
            keep_metric_names: true

          - match: '{__name__=~"http.+_(count|sum)"}'
            interval: 1m
            without: [service.instance.id, http.server_name, http.host]
            outputs: [total]
            keep_metric_names: true

          - match: '{service.name=~"emu|starling", __name__=~"(llm|embed|rerank).+_bucket"}'
            interval: 1m
            without: [service.instance.id, service.name]
            outputs: [total]
            keep_metric_names: true
            output_relabel_configs:
              - target_label: "service.name"
                replacement: "emu"

          # Request counters are aggregated by the dedicated 30s rule below. Excluding
          # them here prevents two cumulative `total` outputs with the same metric name.
          - match: '{service.name=~"emu|starling", __name__=~"(llm|embed|rerank).+_(count|sum)", __name__!~"(llm|embed|rerank)_request_count"}'
            interval: 1m
            without: [service.instance.id, service.name]
            outputs: [total]
            keep_metric_names: true
            output_relabel_configs:
              - target_label: "service.name"
                replacement: "emu"

          - match: "db.client.connections.usage"
            interval: 1m
            without: [service.instance.id]
            outputs: [total]
            keep_metric_names: true

          - match: "http.server.active_requests"
            interval: 1m
            without: [service.instance.id, http.server_name, http.host]
            outputs: [total]
            keep_metric_names: true

          - match:
              - "request_count"
              - "llm_request_count"
              - "embed_request_count"
              - "rerank_request_count"
              - "guard_request_count"
            interval: 30s
            without: [service.instance.id]
            outputs: [total]
            keep_metric_names: true

          - match:
              - "llm_itl_milliseconds"
              - "llm_tpot_milliseconds"
              - "llm_ttft_milliseconds"
              - "embed_completion_time_milliseconds"
              - "rerank_completion_time_milliseconds"
            interval: 30s
            without: [service.instance.id]
            outputs: [max]
            keep_metric_names: true

          - match: "deployment_num_replica"
            interval: 10s
            without: [service.instance.id, service.name]
            outputs: [min]
            keep_metric_names: true
            output_relabel_configs:
              - target_label: "service.name"
                replacement: "emu"

          - match: "model_request_total"
            interval: 30s
            without: [service.instance.id]
            outputs: [total]
            keep_metric_names: true
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  labels:
    app.kubernetes.io/instance: vmagent-tokenvisor
    app.kubernetes.io/part-of: vm-operator
  name: vmagent
  namespace: {{ include "tokenvisor.namespace" . }}
spec:
  replicaCount: {{ $vmagentReplicas }}
{{- include "tokenvisor.haScheduling" (dict "ctx" $ "svc" .Values.victoriametrics.vmagent "podLabels" (dict "app.kubernetes.io/name" "vmagent" "app.kubernetes.io/instance" "vmagent")) | nindent 2 }}
  image:
    repository: {{ $vmagentImageRepo }}
    tag: {{ $vmagentImageTag }}
  serviceScrapeNamespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - {{ include "tokenvisor.namespace" . }}
          - dragonfly-operator-system
          - clickhouse-operator-system
          - cnpg-operator-system
          - vm-operator-system
  serviceScrapeRelabelTemplate:
    - targetLabel: job
      replacement: system-monitor
    - targetLabel: instance
      sourceLabels: [__meta_kubernetes_endpoint_node_name]
  podScrapeNamespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - {{ include "tokenvisor.namespace" . }}
          - cnpg-operator-system
  nodeScrapeSelector:
    matchLabels:
      app.kubernetes.io/instance: system-monitor
{{- with .Values.victoriametrics.vmagent.resources }}
  resources:
{{- toYaml . | nindent 4 }}
{{- end }}
  remoteWrite:
    - url: "http://vminsertinternal-victoria-cluster-shortterm.{{ include "tokenvisor.namespace" . }}.svc:8480/insert/0/prometheus/api/v1/write"
---
