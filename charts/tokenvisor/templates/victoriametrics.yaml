    app.kubernetes.io/part-of: vm-operator
  name: vmauth
  namespace: {{ include "tokenvisor.namespace" . }}
spec:
  replicaCount: {{ $vmauthReplicas }}
{{- include "tokenvisor.haScheduling" (dict "ctx" $ "svc" .Values.victoriametrics.vmauth "podLabels" (dict "app.kubernetes.io/name" "vmauth" "app.kubernetes.io/instance" "vmauth")) | nindent 2 }}
  image:
    repository: {{ $vmauthImageRepo }}
    tag: {{ $vmauthImageTag }}
  userSelector:
    matchLabels:
      app.kubernetes.io/instance: vmuser-tokenvisor
{{- with .Values.victoriametrics.vmauth.resources }}
  resources:
{{- toYaml . | nindent 4 }}
{{- end }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  labels:
    app.kubernetes.io/instance: vmuser-tokenvisor
    app.kubernetes.io/part-of: vm-operator
  name: vmuser
  namespace: {{ include "tokenvisor.namespace" . }}
spec:
  name: vmuser
  username: vmuser
  passwordRef:
    name: {{ $vmUserSecret }}
    key: password
  targetRefs:
    - crd:
        kind: VMCluster/vmselect
        name: victoria-cluster
        namespace: {{ include "tokenvisor.namespace" . }}
      target_path_suffix: "/select/0"
      paths:
        - "/vm/vmui"
        - "/vm/vmui/.*"
        - "/vm/prometheus/api/v1/query"
        - "/vm/prometheus/api/v1/query_range"
        - "/vm/prometheus/api/v1/series"
        - "/vm/prometheus/api/v1/status/.*"
        - "/vm/prometheus/api/v1/label/"
        - "/vm/prometheus/api/v1/label/[^/]+/values"
        - "/vm/prometheus/api/v1/status/tsdb"
        - "/vm/prometheus/api/v1/export"
        - "/vm/prometheus/api/v1/export/csv"
      drop_src_path_prefix_parts: 1
    - crd:
        kind: VMCluster/vmselect
        name: victoria-cluster
        namespace: {{ include "tokenvisor.namespace" . }}
      target_path_suffix: "/select/0/prometheus"
      paths:
        - "/vm/api/v1/query"
        - "/vm/api/v1/query_range"
        - "/vm/api/v1/series"
        - "/vm/api/v1/status/.*"
        - "/vm/api/v1/label/"
        - "/vm/api/v1/label/[^/]+/values"
        - "/vm/api/v1/status/tsdb"
        - "/vm/api/v1/export"
        - "/vm/api/v1/export/csv"
      drop_src_path_prefix_parts: 1
    - static:
        urls:
{{- range $host := $vlHosts }}
          - {{ printf "http://%s.cluster.local:%d/" $host $vlPort }}
{{- end }}
      drop_src_path_prefix_parts: 1
      paths:
        - "/vl/select"
        - "/vl/select/.*"
        - "/vl/logsql"
        - "/vl/logsql/.*"
{{- end }}
