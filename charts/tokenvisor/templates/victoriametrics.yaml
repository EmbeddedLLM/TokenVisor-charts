apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: system-monitor-pvc-capacity
  namespace: {{ include "tokenvisor.namespace" . }}
  labels:
    app.kubernetes.io/part-of: vm-operator
    app.kubernetes.io/instance: system-monitor
spec:
  scheme: https
  tlsConfig:
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    insecureSkipVerify: true
    serverName: localhost
  bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  relabelConfigs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - targetLabel: __address__
      replacement: kubernetes.default.svc:443
    - sourceLabels: [__meta_kubernetes_node_name]
      regex: (.+)
      targetLabel: __metrics_path__
      replacement: /api/v1/nodes/$1/proxy/metrics
    - targetLabel: job
      replacement: system-monitor
  metricRelabelConfigs:
    - sourceLabels: [__name__]
      regex: "(kubelet_volume_stats_used_bytes|kubelet_volume_stats_capacity_bytes)"
      action: keep
    - action: labelkeep
      regex: __name__|namespace|job|instance|container|pod|persistentvolumeclaim
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: system-monitor-network-disk
  namespace: {{ include "tokenvisor.namespace" . }}
  labels:
