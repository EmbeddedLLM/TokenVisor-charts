{{- if and .Values.clickhouse.enabled .Values.clickhouse.secrets.create (not .Values.clickhouse.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-secret
  namespace: {{ include "tokenvisor.namespace" . }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: clickhouse

type: Opaque
stringData:
{{- range $key, $value := .Values.clickhouse.secrets.data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
