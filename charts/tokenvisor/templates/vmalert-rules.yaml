{{- if and .Values.vmalert.enabled .Values.victoriametrics.enabled (.Capabilities.APIVersions.Has "operator.victoriametrics.com/v1beta1") }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    app.kubernetes.io/instance: vmrule-tokenvisor
    app.kubernetes.io/part-of: vm-operator
    vmalert/rule-type: metrics
  name: storage-alert
  namespace: {{ include "tokenvisor.namespace" . }}
spec:
  groups:
    - name: storage.rules
      interval: 30s
      rules:
        - record: chi_clickhouse_disk_free_percentage
          expr: |
            (
              chi_clickhouse_metric_DiskFreeBytes{chi=~".*",hostname=~".*"} /
              chi_clickhouse_metric_DiskTotalBytes{chi=~".*",hostname=~".*"}
            ) * 100
          labels:
            unit: percent
            component: clickhouse
        - alert: ClickHouseDiskUtilizationWarning
          expr: (100 - chi_clickhouse_disk_free_percentage) >= 75
          for: 1h
          labels:
            severity: warning
            component: clickhouse
            alert_category: disk-utilization
          annotations:
            summary: "ClickHouse disk utilization warning"
            description: >-
              ClickHouse disk utilization is {{ "{{ $value }}" }}%
              (warning threshold: 75%).
        - alert: ClickHouseDiskUtilizationCritical
          expr: (100 - chi_clickhouse_disk_free_percentage) >= 90
          for: 1h
          labels:
            severity: critical
            component: clickhouse
            alert_category: disk-utilization
          annotations:
            summary: "ClickHouse disk utilization critical"
            description: >-
              ClickHouse disk utilization is {{ "{{ $value }}" }}%
              (critical threshold: 90%).
        # PostgreSQL disk utilization alerts
        - alert: PostgreSQLDiskUtilizationWarning
          expr: |
            (
              disk_used_bytes{path="/var/lib/postgresql/data"}
              /
              disk_capacity_bytes{path="/var/lib/postgresql/data"}
            ) >= 0.75
            and disk_collection_success{path="/var/lib/postgresql/data"} == 1
          for: 1h
          labels:
            severity: warning
            component: postgresql
            alert_category: disk-utilization
          annotations:
            summary: "PostgreSQL disk utilization warning"
            description: >-
              PostgreSQL disk utilization is {{ "{{ $value | humanizePercentage }}" }}
              (warning threshold: 75%).
        - alert: PostgreSQLDiskUtilizationCritical
          expr: |
            (
              disk_used_bytes{path="/var/lib/postgresql/data"}
              /
              disk_capacity_bytes{path="/var/lib/postgresql/data"}
            ) >= 0.90
            and disk_collection_success{path="/var/lib/postgresql/data"} == 1
          for: 1h
          labels:
            severity: critical
            component: postgresql
            alert_category: disk-utilization
          annotations:
            summary: "PostgreSQL disk utilization critical"
            description: >-
              PostgreSQL disk utilization is {{ "{{ $value | humanizePercentage }}" }}
              (critical threshold: 90%).

        # ModelStorage disk utilization alerts
        - alert: ModelStorageDiskUtilizationWarning
          expr: |
            (
              disk_used_bytes{path="/hf_repo"}
              /
              disk_capacity_bytes{path="/hf_repo"}
            ) >= 0.75
            and disk_collection_success{path="/hf_repo"} == 1
          for: 1h
          labels:
            severity: warning
            component: model-storage
            alert_category: disk-utilization
          annotations:
            summary: "Model storage disk utilization warning"
            description: >-
              Model storage disk utilization is {{ "{{ $value | humanizePercentage }}" }}
              (warning threshold: 75%).
        - alert: ModelStorageDiskUtilizationCritical
          expr: |
            (
              disk_used_bytes{path="/hf_repo"}
              /
              disk_capacity_bytes{path="/hf_repo"}
            ) >= 0.90
            and disk_collection_success{path="/hf_repo"} == 1
          for: 1h
          labels:
            severity: critical
            component: model-storage
            alert_category: disk-utilization
          annotations:
            summary: "Model storage disk utilization critical"
            description: >-
              Model storage disk utilization is {{ "{{ $value | humanizePercentage }}" }}
              (critical threshold: 90%).
        - record: vmcluster_disk_usage_percentage
          expr: |
            (
              max(
                sum(vm_data_size_bytes{job=~"(vminsert-victoria-cluster|vmselect-victoria-cluster|vmstorage-victoria-cluster)", instance=~".*"}) by(job, instance) /
                (
                  sum(vm_free_disk_space_bytes{job=~"(vminsert-victoria-cluster|vmselect-victoria-cluster|vmstorage-victoria-cluster)", instance=~".*"}-vm_free_disk_space_limit_bytes{job=~"(vminsert-victoria-cluster|vmselect-victoria-cluster|vmstorage-victoria-cluster)", instance=~".*"}) by(job, instance) +
                  sum(vm_data_size_bytes{job=~"(vminsert-victoria-cluster|vmselect-victoria-cluster|vmstorage-victoria-cluster)", instance=~".*"}) by(job, instance)
                )
              ) * 100
            )
          labels:
            unit: percent
            component: vmcluster
        - alert: VMClusterDiskUtilizationWarning
          expr: vmcluster_disk_usage_percentage >= 75
          for: 1h
          labels:
            severity: warning
            component: vmcluster
            alert_category: disk-utilization
          annotations:
            summary: "VictoriaMetrics cluster disk utilization warning"
            description: >-
              VictoriaMetrics cluster disk utilization is {{ "{{ $value }}" }}%
              (warning threshold: 75%).
        - alert: VMClusterDiskUtilizationCritical
          expr: vmcluster_disk_usage_percentage >= 90
          for: 1h
          labels:
            severity: critical
            component: vmcluster
            alert_category: disk-utilization
          annotations:
            summary: "VictoriaMetrics cluster disk utilization critical"
            description: >-
              VictoriaMetrics cluster disk utilization is {{ "{{ $value }}" }}%
              (critical threshold: 90%).
---
{{- if .Values.vmalert.enableLogRules }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    app.kubernetes.io/instance: vmrule-tokenvisor
    app.kubernetes.io/part-of: vm-operator
    vmalert/rule-type: logs
  name: tokenvisor-log-alert
  namespace: {{ include "tokenvisor.namespace" . }}
spec:
  groups:
    - name: tokenvisor.rules
      type: vlogs
      interval: 30s
      rules:
        - alert: TokenVisorException
          expr: severity:i(critical) AND (service.name:=emu OR service.name:=starling) | stats by (service.name, code.filepath, code.function, code.lineno, _msg, exception.message, exception.stacktrace) count() as total | filter total:> 0
          labels:
            severity: exception
            component: tokenvisor-log
          annotations:
            summary: "TokenVisor exception detected"
            description: "TokenVisor exception logs detected."
        - alert: TokenVisorError
          expr: severity:i(error) AND (service.name:=emu OR service.name:=starling) | stats by (service.name, code.filepath, code.function, code.lineno, _msg) count() as total | filter total:> 0
          labels:
            severity: critical
            component: tokenvisor-log
          annotations:
            summary: "TokenVisor error detected"
            description: "TokenVisor error logs detected."
        - alert: TokenVisorWarning
          expr: severity:i(warning) AND (service.name:=emu OR service.name:=starling) | stats by (service.name, code.filepath, code.function, code.lineno, _msg) count() as total | filter total:> 0
          labels:
            severity: warning
            component: tokenvisor-log
          annotations:
            summary: "TokenVisor warning detected"
            description: "TokenVisor warning logs detected."
{{- end }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: vmalert-notifications
  namespace: {{ include "tokenvisor.namespace" . }}
  labels:
    app.kubernetes.io/instance: vmalertmanager-config
    app.kubernetes.io/part-of: vm-operator
spec:
  route:
    group_by: ["alertname"]
    group_wait: 10s
    group_interval: 10s
    repeat_interval: 3h
    receiver: tokenvisor-discord
    routes:
      - matchers:
          - component="vmcluster"
        receiver: tokenvisor-discord
      - matchers:
          - component="postgresql"
        receiver: tokenvisor-discord
      - matchers:
          - component="clickhouse"
        receiver: tokenvisor-discord
      - matchers:
          - component="model-storage"
        receiver: tokenvisor-discord
      - matchers:
          - component="tokenvisor-log"
        receiver: tokenvisor-log-discord
  receivers:
    - name: tokenvisor-discord
      discord_configs:
        - webhook_url: {{ .Values.vmalert.tokenvisorWebhookUrl | quote }}
          title: |
            {{ "{{- if .CommonLabels.component -}}" }}
              {{ "{{ title .CommonLabels.component }}" }} ALERT
            {{ "{{- else -}}" }}
              TokenVisor Alert
            {{ "{{- end -}}" }}

          message: |
            {{ "{{- range .Alerts }}" }}
            {{ "{{- if eq .Status \"firing\" -}}" }}
            🚨 **ALERT: {{ "{{ .Labels.alertname }}" }}** {{ "{{- if eq .Labels.severity \"critical\" }}" }} @here{{ "{{ end }}" }}
            **Severity:** {{ "{{ .Labels.severity  }}" }}
            **Summary:** {{ "{{ .Annotations.summary }}" }}
            **Description:** {{ "{{ .Annotations.description }}" }}
            {{ "{{- if .Labels.instance }}" }}
            **Instance:** {{ "{{ .Labels.instance }}" }}
            {{ "{{- end }}" }}
            {{ "{{- if .Labels.hostname }}" }}
            **Hostname:** {{ "{{ .Labels.hostname }}" }}
            {{ "{{- end }}" }}
            {{ "{{- else -}}" }}
            ✅ **RESOLVED: {{ "{{ .Labels.alertname }}" }}**
            **Description:** The alert condition has cleared and utilization is back below the configured threshold.
            {{ "{{ end }}" }}
            ---
            {{ "{{ end }}" }}
          send_resolved: true
    - name: tokenvisor-log-discord
      discord_configs:
        - webhook_url: {{ .Values.vmalert.tokenvisorLogWebhookUrl | quote }}
          title: |
            {{ "{{- if .CommonLabels.service_name -}}" }}
              {{ "{{ title .CommonLabels.service_name }}" }} ALERT
            {{ "{{- else -}}" }}
              TokenVisor Alert
            {{ "{{- end -}}" }}
          # Labels containing "." are normalized to use "_".
          message: |
            {{ "{{- range .Alerts }}" }}
            {{ "{{ if or (eq .Labels.severity \"critical\") (eq .Labels.severity \"exception\") }}" }}
            🚨 **ALERT: {{ "{{ .Labels.alertname }}" }}** @here
            {{ "{{ else }}" }}
            ⚠️ **WARNING: {{ "{{ .Labels.alertname }}" }}**
            {{ "{{ end }}" }}
            **DateTime:** {{ "{{ .StartsAt }}" }}
            **File:** {{ "{{ .Labels.code_filepath  }}" }}
            **Function:** {{ "{{ .Labels.code_function }}" }}
            **Line:** {{ "{{ .Labels.code_lineno }}" }}
            {{ "{{ if eq .Labels.severity \"exception\" -}}" }}
            **Message:** {{ "{{ .Labels.exception_message }}" }}
            **Stacktrace:** {{ "{{ .Labels.exception_stacktrace }}" }}
            {{ "{{ else -}}" }}
            **Message:** {{ "{{ .Labels._msg }}" }}
            {{ "{{- end }}" }}
            ---
            {{ "{{ end }}" }}
          send_resolved: false
  inhibit_rules:
    - source_matchers:
        - severity="critical"
        - component!="tokenvisor-log"
      target_matchers:
        - severity="warning"
        - component!="tokenvisor-log"
      equal: ["component", "alert_category"]
{{- end }}
