{{- $workerReplicas := .Values.starling.replicas }}
{{- if and (hasKey .Values.starling "worker") (hasKey .Values.starling.worker "replicas") }}
{{- $workerReplicas = .Values.starling.worker.replicas }}
{{- end }}
{{- $beatReplicas := .Values.starling.replicas }}
{{- if and (hasKey .Values.starling "beat") (hasKey .Values.starling.beat "replicas") }}
{{- $beatReplicas = .Values.starling.beat.replicas }}
{{- end }}
{{- $workerResources := .Values.starling.resources }}
{{- if and (hasKey .Values.starling "worker") (hasKey .Values.starling.worker "resources") }}
{{- $workerResources = .Values.starling.worker.resources }}
{{- end }}
{{- $beatResources := .Values.starling.resources }}
{{- if and (hasKey .Values.starling "beat") (hasKey .Values.starling.beat "resources") }}
{{- $beatResources = .Values.starling.beat.resources }}
{{- end }}
{{- $otelResources := .Values.emu.otelCollector.resources }}
{{- if and (hasKey .Values.starling "otelCollector") (hasKey .Values.starling.otelCollector "resources") }}
{{- $otelResources = .Values.starling.otelCollector.resources }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starling-worker
  namespace: {{ include "tokenvisor.namespace" . }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: starling-worker
spec:
  replicas: {{ $workerReplicas }}
{{- include "tokenvisor.haStrategy" (dict "ctx" $ "svc" .Values.starling) | nindent 2 }}
  selector:
    matchLabels:
      app: starling-worker
  template:
    metadata:
      labels:
        app: starling-worker
        app.kubernetes.io/instance: tokenvisor-emu-starling-worker
        app.kubernetes.io/part-of: emu-backend
    spec:
{{- include "tokenvisor.haScheduling" (dict "ctx" $ "svc" .Values.starling "podLabels" (dict "app" "starling-worker")) | nindent 6 }}
      serviceAccountName: {{ .Values.starling.serviceAccountName }}
{{- include "tokenvisor.imagePullSecrets" . | nindent 6 }}
{{ if .Values.emu.initWaiter.enabled }}
      initContainers:
        - name: wait-postgres
          image: {{ .Values.emu.initWaiter.postgres.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
{{ include "tokenvisor.waitPostgresScript" . | nindent 14 }}
        - name: wait-clickhouse-vm
          image: {{ .Values.emu.initWaiter.clickhouse.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
{{ include "tokenvisor.waitClickhouseVmScript" . | nindent 14 }}
          env:
            - name: CH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emu.secretRefs.clickhouseSecretName }}
                  key: {{ .Values.emu.secretRefs.clickhousePasswordKey }}
{{ end }}
      containers:
        - name: starling-worker
          image: {{ .Values.starling.image }}
          imagePullPolicy: {{ .Values.starling.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              uv run --no-sync celery -A emu.entrypoints.starling worker --loglevel=info --max-memory-per-child 32768 --autoscale=4,2
          envFrom:
            - configMapRef:
                name: emu-config
{{- if or .Values.emu.secret.existingSecret .Values.emu.secret.create }}
            - secretRef:
                name: {{ default "emu-secret" .Values.emu.secret.existingSecret }}
{{- end }}
          env:
            - name: EMU_VICTORIA_METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emu.secretRefs.vmuserSecretName }}
                  key: {{ .Values.emu.secretRefs.vmuserPasswordKey }}
            - name: EMU_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emu.secretRefs.clickhouseSecretName }}
                  key: {{ .Values.emu.secretRefs.clickhousePasswordKey }}
          resources:
{{- toYaml $workerResources | nindent 12 }}
          volumeMounts:
            - name: model-storage
              mountPath: /hf_repo
        - name: otel-collector
          image: {{ .Values.emu.otelCollector.image }}
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: metrics
              containerPort: 8889
          env:
            - name: CH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emu.secretRefs.clickhouseSecretName }}
                  key: {{ .Values.emu.secretRefs.clickhousePasswordKey }}
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol/config.yaml
              subPath: config.yaml
          resources:
{{- toYaml $otelResources | nindent 12 }}
      volumes:
        - name: otel-config
          configMap:
            name: otel-collector-config
        - name: model-storage
          persistentVolumeClaim:
            claimName: {{ default .Values.storage.modelPvc.name .Values.emu.modelStorage.existingClaim }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starling-beat
  namespace: {{ include "tokenvisor.namespace" . }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: starling-beat
spec:
  replicas: {{ $beatReplicas }}
{{- include "tokenvisor.haStrategy" (dict "ctx" $ "svc" .Values.starling) | nindent 2 }}
  selector:
    matchLabels:
      app: starling-beat
  template:
    metadata:
      labels:
        app: starling-beat
        app.kubernetes.io/instance: tokenvisor-emu-starling-beat
        app.kubernetes.io/part-of: emu-backend
    spec:
{{- include "tokenvisor.haScheduling" (dict "ctx" $ "svc" .Values.starling "podLabels" (dict "app" "starling-beat")) | nindent 6 }}
      serviceAccountName: {{ .Values.starling.serviceAccountName }}
{{- include "tokenvisor.imagePullSecrets" . | nindent 6 }}
{{ if .Values.emu.initWaiter.enabled }}
      initContainers:
        - name: wait-postgres
          image: {{ .Values.emu.initWaiter.postgres.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
{{ include "tokenvisor.waitPostgresScript" . | nindent 14 }}
        - name: wait-clickhouse-vm
          image: {{ .Values.emu.initWaiter.clickhouse.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
{{ include "tokenvisor.waitClickhouseVmScript" . | nindent 14 }}
          env:
            - name: CH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emu.secretRefs.clickhouseSecretName }}
                  key: {{ .Values.emu.secretRefs.clickhousePasswordKey }}
{{ end }}
      containers:
        - name: starling-beat
          image: {{ .Values.starling.image }}
          imagePullPolicy: {{ .Values.starling.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              uv run --no-sync celery -A emu.entrypoints.starling beat --loglevel=info -S redbeat.RedBeatScheduler
          envFrom:
            - configMapRef:
                name: emu-config
{{- if or .Values.emu.secret.existingSecret .Values.emu.secret.create }}
            - secretRef:
                name: {{ default "emu-secret" .Values.emu.secret.existingSecret }}
{{- end }}
          env:
            - name: EMU_VICTORIA_METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emu.secretRefs.vmuserSecretName }}
                  key: {{ .Values.emu.secretRefs.vmuserPasswordKey }}
            - name: EMU_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emu.secretRefs.clickhouseSecretName }}
                  key: {{ .Values.emu.secretRefs.clickhousePasswordKey }}
          resources:
{{- toYaml $beatResources | nindent 12 }}
        - name: otel-collector
          image: {{ .Values.emu.otelCollector.image }}
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: metrics
              containerPort: 8889
          env:
            - name: CH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.emu.secretRefs.clickhouseSecretName }}
                  key: {{ .Values.emu.secretRefs.clickhousePasswordKey }}
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol/config.yaml
              subPath: config.yaml
          resources:
{{- toYaml $otelResources | nindent 12 }}
      volumes:
        - name: otel-config
          configMap:
            name: otel-collector-config
