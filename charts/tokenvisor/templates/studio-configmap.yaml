apiVersion: v1
kind: ConfigMap
metadata:
  name: studio-config
  namespace: {{ include "tokenvisor.namespace" . }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: studio

data:
{{- range $key, $value := .Values.studio.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studio-auth-yaml-config
  namespace: {{ include "tokenvisor.namespace" . }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: studio

data:
  studio-config.yml: |
{{- .Values.studio.authConfigYaml | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studio-themes
  namespace: {{ include "tokenvisor.namespace" . }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: studio

data:
  theme.css: |
{{- .Values.studio.themeCss | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studio-logos
  namespace: {{ include "tokenvisor.namespace" . }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: studio

binaryData:
{{- $logos := dict }}
{{- range $path, $_ := .Files.Glob "files/logos/*.svg" }}
{{- $_ := set $logos (base $path) ($.Files.Get $path | b64enc) }}
{{- end }}
{{- range $key, $value := .Values.studio.logosBinaryData }}
{{- $_ := set $logos $key $value }}
{{- end }}
{{- range $key, $value := $logos }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
