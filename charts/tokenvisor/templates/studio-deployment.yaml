apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-deployment
  namespace: {{ include "tokenvisor.namespace" . }}
  labels:
    {{- include "tokenvisor.labels" . | nindent 4 }}
    app: studio
spec:
  replicas: {{ .Values.studio.replicas }}
{{- include "tokenvisor.haStrategy" (dict "ctx" $ "svc" .Values.studio) | nindent 2 }}
  selector:
    matchLabels:
      app: studio
  template:
    metadata:
      labels:
        app: studio
    spec:
{{- include "tokenvisor.haScheduling" (dict "ctx" $ "svc" .Values.studio "podLabels" (dict "app" "studio")) | nindent 6 }}
      serviceAccountName: {{ .Values.studio.serviceAccountName }}
{{- include "tokenvisor.imagePullSecrets" . | nindent 6 }}
{{- if .Values.studio.initWaiter.enabled }}
      initContainers:
        - name: wait-emu
          image: {{ .Values.studio.initWaiter.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              URL="{{ .Values.studio.initWaiter.emuHealthUrl }}"
              INTERVAL="{{ .Values.studio.initWaiter.intervalSeconds }}"
              ATTEMPTS={{ div (int .Values.studio.initWaiter.timeoutSeconds) (int .Values.studio.initWaiter.intervalSeconds) }}
              echo "Waiting for EMU at ${URL}..."
              i=0
              while [ $i -lt $ATTEMPTS ]; do
                code=$(curl -s -o /dev/null -w "%{http_code}" "${URL}" || true)
                if [ "${code}" = "200" ]; then
                  echo "EMU is ready."
                  exit 0
                fi
                i=$((i+1))
                sleep "${INTERVAL}"
              done
              echo "Timed out waiting for EMU."
              exit 1
{{- end }}
      containers:
        - name: studio
          image: {{ .Values.studio.image }}
          imagePullPolicy: {{ .Values.studio.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.studio.service.port | int }}
          envFrom:
            - configMapRef:
                name: studio-config
{{- if or .Values.studio.secret.existingSecret .Values.studio.secret.create }}
            - secretRef:
                name: {{ default "studio-secret" .Values.studio.secret.existingSecret }}
{{- end }}
{{- if or .Values.emu.secret.existingSecret .Values.emu.secret.create }}
            - secretRef:
                name: {{ default "emu-secret" .Values.emu.secret.existingSecret }}
{{- end }}
          volumeMounts:
            - name: logos-volume
              mountPath: /app/static/icon-landscape.svg
              subPath: icon-landscape.svg
            - name: logos-volume
              mountPath: /app/static/icon-landscape-auth.svg
              subPath: icon-landscape-auth.svg
            - name: logos-volume
              mountPath: /app/static/favicon.svg
              subPath: favicon.svg
            - name: logos-volume
              mountPath: /app/static/icon-square.svg
              subPath: icon-square.svg
            - name: auth-yaml-config
              mountPath: /app/studio-config.yml
              subPath: studio-config.yml
            - name: themes-volume
              mountPath: /app/static/theme.css
              subPath: theme.css
{{- with .Values.studio.resources }}
          resources:
{{- toYaml . | nindent 12 }}
{{- end }}
          command: ["node", "server"]
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.studio.service.port | int }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.studio.service.port | int }}
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: logos-volume
          configMap:
            name: studio-logos
        - name: themes-volume
          configMap:
            name: studio-themes
        - name: auth-yaml-config
          configMap:
            name: studio-auth-yaml-config
