# TokenVisor secrets template
#
# Usage:
# 1) Copy this file and edit placeholders.
# 2) Apply it to the cluster.
#
# Example:
#   cp docs/SECRETS_TEMPLATE.yaml /tmp/tokenvisor-secrets.yaml
#   ${EDITOR:-vi} /tmp/tokenvisor-secrets.yaml
#   kubectl apply -f /tmp/tokenvisor-secrets.yaml
#
# Notes:
# - Default namespace here is `tokenvisor`.
# - If you rename secret names/keys, also update chart values accordingly.
# - Keep secrets out of git.
# - Do not apply with `CHANGE_ME_*` values unchanged.

apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-secret
  namespace: tokenvisor
type: Opaque
stringData:
  cluster_secret: "CHANGE_ME_CLICKHOUSE_CLUSTER_SECRET"
  db_user_password: "CHANGE_ME_CLICKHOUSE_USER_PASSWORD"
  db_readonly_user_password: "CHANGE_ME_CLICKHOUSE_READONLY_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: pg-emu-user-secret
  namespace: tokenvisor
type: kubernetes.io/basic-auth
stringData:
  username: "emupg"
  password: "CHANGE_ME_EMUPG_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: vmuser-secret
  namespace: tokenvisor
type: Opaque
stringData:
  password: "CHANGE_ME_VMUSER_PASSWORD"
---
# Required for EMU runtime and API auth.
apiVersion: v1
kind: Secret
metadata:
  name: emu-secret
  namespace: tokenvisor
type: Opaque
stringData:
  # Password in EMU_DB_PATH must match pg-emu-user-secret.password.
  EMU_DB_PATH: "postgresql+psycopg://emupg:CHANGE_ME_EMUPG_PASSWORD@tokenvisor-pgbouncer.tokenvisor.svc.cluster.local:5432/emu"
  EMU_SERVICE_KEY: "CHANGE_ME_EMU_SERVICE_KEY"

  # Optional provider/API keys. Remove keys you do not use.
  EMU_OPENAI_API_KEY: ""
  EMU_HUGGINGFACE_API_KEY: ""
  EMU_OPENROUTER_API_KEY: ""
  EMU_ANTHROPIC_API_KEY: ""
  EMU_CEREBRAS_API_KEY: ""
  EMU_COHERE_API_KEY: ""
  EMU_GEMINI_API_KEY: ""
  EMU_GROQ_API_KEY: ""
  EMU_HYPERBOLIC_API_KEY: ""
  EMU_JINA_AI_API_KEY: ""
  EMU_SAMBANOVA_API_KEY: ""
  EMU_TOGETHER_AI_API_KEY: ""
  EMU_VOYAGE_API_KEY: ""
  EMU_RESEND_API_KEY: ""
---
# Required for Studio auth.
apiVersion: v1
kind: Secret
metadata:
  name: studio-secret
  namespace: tokenvisor
type: Opaque
stringData:
  STUDIO_AUTH_SECRET: "CHANGE_ME_STUDIO_AUTH_SECRET"
---
# Optional: only used if grafana.enabled=true
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: tokenvisor
type: Opaque
stringData:
  admin_password: ""
